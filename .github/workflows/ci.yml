name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Tipos (frontend)
        run: npx tsc -b
      - name: Tipos (edge functions)
        run: |
          for f in supabase/functions/*/index.ts; do
            deno check --config "$(dirname "$f")/deno.json" "$f"
          done
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
